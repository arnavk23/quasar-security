[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyqad"
version = "0.1.0"
description = "Hybrid AI-Quantum Anomaly Detection for QKD systems: calibrated uncertainty quantification for physical-layer quantum key distribution attacks."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Arnav Kapoor", email = "arnavkapoor23@iiserb.ac.in" },
]
keywords = [
    "quantum key distribution",
    "anomaly detection",
    "uncertainty quantification",
    "quantum machine learning",
    "cybersecurity",
    "gaussian processes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pennylane>=0.35",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["hyqad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
